<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>대련 맛집 지도</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--bg:#fff;--soft:#f3f4f6;--line:#e5e7eb;--text:#111827;--sub:#6b7280;--accent:#e8590c}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,"Malgun Gothic",sans-serif;word-break:keep-all;line-height:1.5}
button{font:inherit;white-space:nowrap;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:6px 12px;cursor:pointer}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:default}
input[type=text],input[type=email],input[type=password],textarea{font:inherit;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
label{display:grid;gap:2px;font-size:12px;color:var(--sub)}
header.top{position:sticky;top:0;z-index:1100;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header.top h1{font-size:18px;margin:0 6px 0 0}
#q{flex:1;min-width:160px;max-width:320px}
.spacer{flex:1}
.who{font-size:13px;color:var(--sub)}
.filters{padding:8px 16px;border-bottom:1px solid var(--line);display:grid;gap:6px;background:var(--bg)}
.fr{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fr .lab{font-size:12px;color:var(--sub);width:34px}
.fr{scrollbar-width:none}
.fr::-webkit-scrollbar{display:none}
.chip{padding:3px 10px;font-size:13px;border-radius:999px}
.chip .n{color:var(--sub);margin-left:3px;font-size:12px}
.chip.on .n{color:#fff}
.layout{display:grid;grid-template-columns:minmax(360px,520px) 1fr;height:calc(100vh - var(--hh,150px))}
#list{overflow:auto;padding:12px 16px;display:grid;gap:14px;align-content:start;grid-auto-rows:max-content}
#map{height:100%;min-height:300px}
.mtabs{display:none}
.card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.card.hl{outline:2px solid var(--accent)}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:var(--soft)}
.gal img{width:100%;flex:none;aspect-ratio:4/3;object-fit:cover;scroll-snap-align:center;cursor:pointer}
.gal.one img{aspect-ratio:4/3}
.body{padding:12px 14px}
.nm{font-size:17px;font-weight:700}
.zh{font-size:13px;color:var(--sub)}
.meta{font-size:13px;color:var(--sub);margin-top:2px}
.menu{margin-top:8px;font-size:14px}
.menu b{font-weight:600}
.note{margin-top:6px;font-size:14px;white-space:pre-wrap}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.cm{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;display:grid;gap:8px}
.c{font-size:14px;border-bottom:1px solid var(--soft);padding-bottom:6px}
.c .by{font-size:12px;color:var(--sub)}
.c .by button{border:0;padding:0 4px;font-size:12px;color:var(--sub);background:none}
.tag{font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 8px;margin-left:6px}
.empty{padding:40px 16px;color:var(--sub);text-align:center}
dialog{border:0;border-radius:12px;padding:0;max-width:94vw}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog.pic img{display:block;max-width:94vw;max-height:88vh}
form.dlg{display:grid;gap:10px;padding:20px;width:min(520px,92vw);max-height:90vh;overflow:auto}
form.dlg h2{font-size:17px;margin:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions{display:flex;gap:8px;justify-content:flex-end}
.prev{display:flex;gap:6px;flex-wrap:wrap}
.prev img{width:60px;height:60px;object-fit:cover;border-radius:8px}
.msg{min-height:20px;font-size:13px;color:var(--accent)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:2000}
#toast.show{opacity:1}
/* 하단 시트(모바일): 목록 ↔ 가게 상세, 위아래로 끌어서 높이를 바꾼다 */
#sheet{position:fixed;left:0;right:0;top:var(--st,100dvh);bottom:0;z-index:1050;background:var(--bg);border-radius:16px 16px 0 0;box-shadow:0 -2px 14px rgba(0,0,0,.28);display:none;flex-direction:column;transition:top .2s ease}
#sheet.open{display:flex}
#sheet.dragging{transition:none}
.grab{padding:9px 0 3px;display:flex;justify-content:center;touch-action:none;cursor:grab}
.grab span{width:40px;height:5px;border-radius:3px;background:#d1d5db}
#sheet .sh{display:flex;align-items:center;gap:8px;padding:2px 14px 8px;touch-action:none}
#sheettitle{flex:1;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sheetbody{overflow:auto;padding:0 10px 24px;flex:1;overscroll-behavior:contain}
#sheetbody .card{border:0}
#sheetbody .gal img{aspect-ratio:16/10}
.lrow{display:flex;gap:12px;padding:10px 4px;border-bottom:1px solid var(--soft);cursor:pointer}
.lrow img,.lrow .noimg{width:72px;height:72px;border-radius:10px;object-fit:cover;flex:none;background:var(--soft)}
.lrow .lt{min-width:0}
.lrow .nm2{font-weight:700;font-size:15px}
.lrow .sub2{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menubtn{display:none}
.menupanel{display:contents}
.fbtn{display:none}
@media(min-width:821px){#sheet{display:none!important}}
.pin.cl{background:#111827;color:#fff;font:600 12px/22px Pretendard,sans-serif;text-align:center;border:2px solid #fff}
.lbl.always{display:block}
.lbl.left{left:auto;right:20px}
.lbl{display:none;position:absolute;left:20px;top:-1px;white-space:nowrap;font-size:12px;font-weight:600;color:#111827;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;pointer-events:none}
.show-labels .lbl{display:block}
.pvw{position:relative;width:96px}
.prev .pvw img{width:96px;height:96px;object-fit:cover;border-radius:8px;display:block}
.pvw .ord{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.5);color:#fff;border-radius:999px;font-size:11px;padding:0 7px}
.pvw .pb{display:flex;gap:2px;margin-top:3px}
.pvw .pb button{flex:1;padding:2px 0;font-size:13px}
#pick{height:210px;border-radius:10px;overflow:hidden;border:1px solid var(--line);margin-top:2px}
.dup{border:1px solid var(--accent);border-radius:10px;padding:8px 10px;display:grid;gap:6px;background:#fff7f1}
.dup .dh{font-size:13px;font-weight:600;color:var(--accent)}
.dup .dr{display:flex;gap:8px;justify-content:space-between;align-items:center}
.dup .dr button{padding:3px 10px;font-size:13px}
select{font:inherit;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;background:var(--bg)}
.gwrap{position:relative}
.gal{scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.38);color:#fff;font-size:24px;line-height:1;padding:0 0 3px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.gnav:hover{background:rgba(0,0,0,.55)}
.gprev{left:8px}.gnext{right:8px}
.gcount{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.45);color:#fff;border-radius:999px;font-size:12px;padding:1px 9px}
.adds{margin-top:10px;display:grid;gap:8px}
.add{background:var(--soft);border-radius:10px;padding:8px 10px}
.add .by{font-size:12px;color:var(--sub)}
.add .by button{border:0;padding:0 4px;font-size:12px;color:var(--sub);background:none}
.aph{display:flex;gap:6px;overflow-x:auto;margin-top:6px}
.aph img{width:72px;height:72px;object-fit:cover;border-radius:8px;cursor:pointer;flex:none}
form.guide{width:min(560px,92vw)}
.guide h3{font-size:14px;margin:12px 0 4px}
.guide ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.locbtn{background:#fff;border:2px solid rgba(0,0,0,.25);border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer}
.locbtn.on{background:#2563eb;color:#fff;border-color:#2563eb}
.pin{background:var(--accent);border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
@media(max-width:820px){
  body{overflow:hidden}
  /* 위쪽: 검색창과 메뉴 버튼이 지도 위에 떠 있다(네이버·카카오·구글 지도 방식) */
  header.top{position:fixed;top:0;left:0;right:0;background:transparent;border:0;padding:8px 10px 0;gap:8px;flex-wrap:nowrap}
  header.top h1{display:none}
  .spacer{display:none}
  #q{max-width:none;min-width:0;flex:1;background:#fff;border:0;border-radius:999px;padding:11px 18px;font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .menubtn{display:block;background:#fff;border:0;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.3);padding:11px 16px;font-size:15px}
  .menupanel{display:none;position:absolute;right:10px;top:58px;background:#fff;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.3);padding:10px;flex-direction:column;gap:8px;min-width:150px}
  .menupanel.open{display:flex}
  .menupanel button{width:100%;text-align:left}
  .menupanel .who{padding:0 4px}
  /* 종류 칩은 한 줄, 지역·가격은 '필터'를 눌러 펼친다 */
  .filters{position:fixed;top:58px;left:0;right:0;z-index:1090;background:transparent;border:0;padding:6px 10px 0;gap:6px;pointer-events:none}
  .filters .fr,.filters .chip{pointer-events:auto}
  .fr{flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 4px}
  .fr .lab{display:none}
  .chip{background:#fff;border:0;box-shadow:0 1px 5px rgba(0,0,0,.3);padding:7px 13px;font-size:14px;flex:none}
  .chip.on{background:var(--accent);color:#fff}
  .fbtn{display:inline-block}
  .filters .fr:not(:first-child){display:none}
  .filters.open .fr{display:flex}
  /* 지도는 화면 전체 */
  .layout{position:fixed;inset:0;display:block;height:100dvh}
  #list{display:none}
  #map{height:100dvh;min-height:0;display:block}
  .mtabs{display:none!important}
  .leaflet-control-zoom{display:none}
  .locbtn{border-radius:999px;padding:10px 16px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.3);border:0}
  #toast{bottom:auto;top:110px}
}
</style>
</head>
<body>
<header class="top" id="top">
  <h1>대련 맛집 지도</h1>
  <input type="text" id="q" placeholder="이름·메뉴 검색">
  <span class="spacer"></span>
  <button id="menubtn" class="menubtn" type="button">메뉴</button>
  <div class="menupanel" id="menupanel">
    <button id="guidebtn">안내</button>
    <button id="suggest">새 가게 추천</button>
    <button id="mine" style="display:none">내 글</button>
    <span class="who" id="who"></span>
    <button id="login">로그인</button>
  </div>
</header>
<div class="filters" id="filters"></div>
<div class="mtabs" id="mtabs"><button class="on" data-v="list">목록</button><button data-v="map">지도</button></div>
<div class="layout" id="layout"><div id="list"></div><div id="map"></div></div>

<dialog id="pic" class="pic"><img id="picimg" alt=""></dialog>

<dialog id="guidedlg"><form class="dlg guide" id="guideform">
  <h2 id="guidetitle"></h2>
  <div id="guidebody"></div>
  <div class="actions"><button type="submit" class="on" id="guideok">확인했습니다</button></div>
</form></dialog>

<dialog id="logdlg"><form class="dlg" id="logform">
  <h2>로그인</h2>
  <label>이메일<input type="email" name="email" required autocomplete="username"></label>
  <label>비밀번호(6자 이상)<input type="password" name="pw" minlength="6" required autocomplete="current-password"></label>
  <label>이름(가입할 때만)<input type="text" name="name" autocomplete="name"></label>
  <div class="msg" id="logmsg"></div>
  <div class="actions"><button type="button" id="logcancel">취소</button><button type="submit" class="on" data-m="in" style="order:3">로그인</button><button type="submit" data-m="up" style="order:2">가입</button></div>
</form></dialog>

<dialog id="sugdlg"><form class="dlg" id="sugform">
  <h2 id="sugtitle">새 가게 추천</h2>
  <div id="dup" class="dup" style="display:none"></div>
  <div id="sugaddnote" class="by" style="display:none;color:var(--sub)">추천 메뉴, 가격, 메모, 사진 중 알려 주고 싶은 것을 적어 주세요. <button type="button" id="sugback">새 가게로 등록</button></div>
  <div id="sugnew">
    <div class="g2"><label>Amap 이름(중국어 이름)<input type="text" name="zh" maxlength="200"></label><label>한글 이름<input type="text" name="ko" required maxlength="100"></label></div>
    <label style="margin-top:10px">위치(지도를 눌러 표시)<div id="pick"></div></label>
    <div class="actions" style="justify-content:flex-start;margin-top:6px"><button type="button" id="geo">현재 위치로 이동</button></div>
    <div class="g2" style="margin-top:10px"><label>음식 종류<select name="cat"></select></label><label>세부 종류(선택)<input type="text" name="detail" maxlength="40" placeholder="예: 동북요리, 양꼬치"></label></div>
  </div>
  <div class="g2"><label>인당 가격(위안)<input type="text" name="price" maxlength="40"></label><label>추천 메뉴<input type="text" name="menu" maxlength="300"></label></div>
  <label>메모<textarea name="note" rows="3" maxlength="1500"></textarea></label>
  <label>사진(최대 10장)<input type="file" name="photos" accept="image/*" multiple></label>
  <div class="prev" id="prev"></div>
  <div class="msg" id="sugmsg"></div>
  <div class="actions"><button type="button" id="sugcancel">취소</button><button type="submit" class="on" id="sugsend">제출</button></div>
</form></dialog>

<dialog id="mydlg"><form class="dlg" id="myform">
  <h2>내 글</h2>
  <div id="mylist" style="display:grid;gap:8px"></div>
  <div class="msg" id="mymsg"></div>
  <div class="actions"><button type="button" id="myclose">닫기</button></div>
</form></dialog>
<div id="sheet"><div class="grab" id="grab"><span></span></div><div class="sh" id="sheethead"><span id="sheettitle"></span><button id="sheetclose" style="display:none">닫기</button></div><div id="sheetbody"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.23.0/dist/index.js"></script>
<script src="config.js"></script>
<script>
const sb = (window.supabase && APP_CONFIG.SUPABASE_URL) ? supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_ANON_KEY) : null;
const $ = id => document.getElementById(id);
const isMobile = () => matchMedia("(max-width:820px)").matches;
const esc = v => String(v ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
const say = t => { const m = document.querySelector("dialog[open] .msg"); if (m) m.textContent = t; toast(t); };
const toast = t => { const el = $("toast"); el.textContent = t; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 2200); };
const PRICE_BANDS = [["~60", 0, 60], ["60~100", 60, 100], ["100~150", 100, 150], ["150~", 150, 1e9]];

let PLACES = [], COMMENTS = {}, ADDS = {}, EDITS = {}, admin = false, map, markers = {}, user = null, status = "";
const F = { q: "", tag: new Set(), region: new Set(), price: new Set(), near: false, open: false };
const openComments = new Set();
let editBase = null, baseOrig = null, kindTouched = false, pickMoved = false;
const maxPhotos = () => editBase ? 30 : 10;   // 선생님이 올리는 글은 10장, 관리자가 고치는 기본 가게는 30장까지
let editingC = null, editRow = null, items = [], origPhotos = [], fromMine = false;   // items: 사진 목록(기존 {url}, 새로 고른 {blob, src}) — 순서가 곧 보이는 순서

// ---------- 데이터 ----------
async function load() {
  PLACES = await (await fetch("data/restaurants.json")).json();
  render();
  if (!sb) return;
  try {
    const [s, c, pe] = await Promise.all([
      sb.from("suggestions").select("*").eq("status", "approved").order("created_at"),
      sb.from("comments").select("*").eq("hidden", false).order("created_at"),
      sb.from("place_edits").select("*"),
    ]);
    EDITS = {}; (pe.data || []).forEach(x => EDITS[x.place_id] = x);
    applyEdits(PLACES);
    if (s.data) {
      PLACES = PLACES.concat(s.data.filter(x => !x.target_place).map(toPlace));
      ADDS = {}; s.data.filter(x => x.target_place).forEach(x => (ADDS[x.target_place] ||= []).push(x));   // 이미 있는 가게에 덧붙인 내용
    }
    COMMENTS = {};
    (c.data || []).forEach(x => (COMMENTS[x.place_no] ||= []).push(x));
    if (s.error || c.error) toast("댓글을 불러오지 못했습니다");
  } catch (e) { toast("댓글을 불러오지 못했습니다"); }
  render();
}
function applyEdits(list) {
  list.forEach(p => {
    const e = EDITS[p.id]; if (!e) return;
    ["ko", "zh", "kind", "price", "menu", "note"].forEach(k => { if (e[k] != null) p[k] = e[k]; });
    if (e.kind != null) p.tags = [kindTag(e.kind)];
    if (e.price != null) { const m = (e.price || "").match(/\d+/); p.priceMin = m ? +m[0] : null; }
    if (e.photos != null) p.photos = e.photos;
    if (e.lat != null && e.lon != null) { p.lat = +e.lat; p.lon = +e.lon; const g = gcj(+e.lat, +e.lon); p.glat = g[0]; p.glon = g[1]; }
  });
}
function toPlace(s) {
  const m = (s.price || "").match(/\d+/), tags = [kindTag(s.kind)];
  return { id: "s" + s.id, ko: s.ko, zh: s.zh, kind: s.kind, tags, price: s.price, priceMin: m ? +m[0] : null, region: "",
    lat: s.lat, lon: s.lon, glat: s.lat ? gcj(+s.lat, +s.lon)[0] : null, glon: s.lat ? gcj(+s.lat, +s.lon)[1] : null,
    menu: s.menu, note: s.note, photos: s.photos || [], nFood: (s.photos || []).length, url: true, by: s.author_name, uid: s.user_id, raw: s };
}
function gcj(lat, lon) {
  const a = 6378245.0, ee = 0.00669342162296594323;
  const tl = (x, y) => -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x)) + (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI) + 20*Math.sin(y*Math.PI) + 40*Math.sin(y/3*Math.PI) + 160*Math.sin(y/12*Math.PI) + 320*Math.sin(y*Math.PI/30)) * 2/3;
  const tn = (x, y) => 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x)) + (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI) + 20*Math.sin(x*Math.PI) + 40*Math.sin(x/3*Math.PI) + 150*Math.sin(x/12*Math.PI) + 300*Math.sin(x/30*Math.PI)) * 2/3;
  let dl = tl(lon - 105, lat - 35), dn = tn(lon - 105, lat - 35);
  const rl = lat / 180 * Math.PI, m = 1 - ee * Math.sin(rl) ** 2, sm = Math.sqrt(m);
  dl = dl * 180 / ((a * (1 - ee)) / (m * sm) * Math.PI); dn = dn * 180 / (a / sm * Math.cos(rl) * Math.PI);
  return [lat + dl, lon + dn];
}

      const o = baseOrig, ch = {}, prev = EDITS[editBase] || {};
      ["ko", "zh", "price", "menu", "note"].forEach(k => { if (fields[k] !== (o[k] || "")) ch[k] = fields[k]; });
      if (kindTouched && fields.kind !== (o.kind || "")) ch.kind = fields.kind;
      if (pickMoved) { ch.lat = fields.lat; ch.lon = fields.lon; }
      if (JSON.stringify(finalPhotos) !== JSON.stringify(o.photos)) ch.photos = finalPhotos;
      if (!Object.keys(ch).length) { $("sugdlg").close(); toast("바뀐 내용이 없습니다"); btn.disabled = false; return; }
      const row = { place_id: editBase };
      ["ko", "zh", "kind", "price", "menu", "note", "photos", "lat", "lon"].forEach(k => { const v = k in ch ? ch[k] : prev[k]; if (v != null) row[k] = v; });
      const { error } = await sb.from("place_edits").upsert(row, { onConflict: "place_id" });
      if (error) throw error;
      const paths = origPhotos.filter(u => !finalPhotos.includes(u)).map(u => decodeURIComponent((u.split("/object/public/photos/")[1] || ""))).filter(Boolean);
      if (paths.length) sb.storage.from("photos").remove(paths);
      $("sugdlg").close(); toast("수정했습니다"); load();
    } else if (editRow) {
      const { error } = await sb.from("suggestions").update({ ...fields, photos: finalPhotos }).eq("id", editRow.id);
      if (error) throw error;
      const paths = origPhotos.filter(u => !finalPhotos.includes(u)).map(u => decodeURIComponent((u.split("/object/public/photos/")[1] || ""))).filter(x => x && (admin || x.startsWith(user.id + "/")));
      if (paths.length) sb.storage.from("photos").remove(paths);   // 지운 사진 파일도 정리(실패해도 무방)
      $("sugdlg").close(); toast("수정했습니다"); load();
      if (fromMine) { fromMine = false; openMine(); }
    } else {
      const { error } = await sb.from("suggestions").insert({ ...fields, photos: finalPhotos });
      if (error) throw error;
      $("sugdlg").close(); toast(isAdd ? "제출했습니다. 관리자 확인 후 가게에 추가됩니다" : "제출했습니다. 관리자 확인 후 공개됩니다");
    }
  } catch (err) { say("제출하지 못했습니다: " + (err.message || err)); }
  btn.disabled = false;
});

// ---------- 중국어 이름 -> 한글 표기(중국어 표기법을 단순화한 규칙. 참고용이라 사람이 고칠 수 있다) ----------
const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ", JUNG = "ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ", JONG = ["", "ㄱ", "ㄲ", "ㄳ", "ㄴ", "ㄵ", "ㄶ", "ㄷ", "ㄹ", "ㄺ", "ㄻ", "ㄼ", "ㄽ", "ㄾ", "ㄿ", "ㅀ", "ㅁ", "ㅂ", "ㅄ", "ㅅ", "ㅆ", "ㅇ", "ㅈ", "ㅊ", "ㅋ", "ㅌ", "ㅍ", "ㅎ"];
const syl = (on, v, c = "") => String.fromCharCode(0xAC00 + (CHO.indexOf(on) * 21 + JUNG.indexOf(v)) * 28 + JONG.indexOf(c));
const ONSET = { b: "ㅂ", p: "ㅍ", m: "ㅁ", f: "ㅍ", d: "ㄷ", t: "ㅌ", n: "ㄴ", l: "ㄹ", g: "ㄱ", k: "ㅋ", h: "ㅎ", j: "ㅈ", q: "ㅊ", x: "ㅅ", zh: "ㅈ", ch: "ㅊ", sh: "ㅅ", r: "ㄹ", z: "ㅉ", c: "ㅊ", s: "ㅆ" };
// 일반 자음 뒤의 운모: [모음, 받침, 뒤에 붙는 글자]
const FIN = { a: ["ㅏ", "", ""], o: ["ㅓ", "", ""], e: ["ㅓ", "", ""], ai: ["ㅏ", "", "이"], ei: ["ㅔ", "", "이"], ao: ["ㅏ", "", "오"], ou: ["ㅓ", "", "우"], an: ["ㅏ", "ㄴ", ""], en: ["ㅓ", "ㄴ", ""], ang: ["ㅏ", "ㅇ", ""], eng: ["ㅓ", "ㅇ", ""], ong: ["ㅜ", "ㅇ", ""], er: ["ㅓ", "ㄹ", ""],
  i: ["ㅣ", "", ""], ia: ["ㅑ", "", ""], ie: ["ㅖ", "", ""], iao: ["ㅑ", "", "오"], iu: ["ㅠ", "", ""], ian: ["ㅖ", "ㄴ", ""], in: ["ㅣ", "ㄴ", ""], iang: ["ㅑ", "ㅇ", ""], ing: ["ㅣ", "ㅇ", ""], iong: ["ㅠ", "ㅇ", ""],
  u: ["ㅜ", "", ""], ua: ["ㅘ", "", ""], uo: ["ㅝ", "", ""], uai: ["ㅘ", "", "이"], ui: ["ㅜ", "", "이"], uan: ["ㅘ", "ㄴ", ""], un: ["ㅜ", "ㄴ", ""], uang: ["ㅘ", "ㅇ", ""], v: ["ㅟ", "", ""], ve: ["ㅟ", "", "에"], van: ["ㅟ", "", "안"], vn: ["ㅟ", "ㄴ", ""] };
const BPMF_O = { o: ["ㅗ", "", ""] };
const SPECIAL = { zhi: "즈", chi: "츠", shi: "스", ri: "르", zi: "쯔", ci: "츠", si: "쓰", er: "얼",
  ya: "야", yo: "요", ye: "예", yao: "야오", you: "유", yan: "옌", yin: "인", yang: "양", ying: "잉", yong: "융", yi: "이", yu: "위", yue: "웨", yuan: "위안", yun: "윈",
  wa: "와", wo: "워", wai: "와이", wei: "웨이", wan: "완", wen: "원", wang: "왕", weng: "웡", wu: "우", a: "아", o: "오", e: "어", ai: "아이", ei: "에이", ao: "아오", ou: "어우", an: "안", en: "언", ang: "앙", eng: "엉" };
// j q x 뒤: u 계열은 ü, ia/ie/iao/iu/ian/iang/iong 는 ㅈ·ㅊ 뒤에서 ㅑ·ㅖ 등을 풀어 쓴다
const PAL = { ia: ["ㅏ", "", ""], ie: ["ㅔ", "", ""], iao: ["ㅏ", "", "오"], iu: ["ㅜ", "", ""], ian: ["ㅔ", "ㄴ", ""], iang: ["ㅏ", "ㅇ", ""], iong: ["ㅜ", "ㅇ", ""],
  u: ["ㅟ", "", ""], ue: ["ㅞ", "", ""], uan: ["ㅟ", "", "안"], un: ["ㅟ", "ㄴ", ""] };
const PAL_X = { ia: ["ㅑ", "", ""], ie: ["ㅖ", "", ""], iao: ["ㅑ", "", "오"], iu: ["ㅠ", "", ""], ian: ["ㅖ", "ㄴ", ""], iang: ["ㅑ", "ㅇ", ""], iong: ["ㅠ", "ㅇ", ""],
  u: ["ㅟ", "", ""], ue: ["ㅞ", "", ""], uan: ["ㅟ", "", "안"], un: ["ㅟ", "ㄴ", ""] };
function pyToHangul(py) {
  py = py.toLowerCase().replace(/ü/g, "v");
  if (SPECIAL[py]) return SPECIAL[py];
  const on = /^(zh|ch|sh)/.test(py) ? py.slice(0, 2) : py[0], fin = py.slice(on.length);
  if (!ONSET[on]) return py;
  let t;
  if ("jqx".includes(on)) t = ((on === "x" ? PAL_X : PAL)[fin]) || FIN[fin];
  else if ("bpmf".includes(on) && BPMF_O[fin]) t = BPMF_O[fin];
  else if ("nl".includes(on) && (fin === "u" || fin === "ve" || fin === "v")) t = fin === "u" ? FIN.u : FIN[fin];
  else t = FIN[fin];
  if (!t) return py;
  return syl(ONSET[on], t[0], t[1]) + t[2];
}
function zhToKo(text) {
  if (!window.pinyinPro) return "";
  const head = text.split(/[(（\[]/)[0];           // 지점 표기는 뺀다: 海底捞火锅(安盛店) -> 海底捞火锅
  return [...head].map(ch => /[一-鿿]/.test(ch) ? pyToHangul(pinyinPro.pinyin(ch, { toneType: "none", type: "array" })[0] || "") : ch).join("").replace(/\s+/g, " ").trim();
}
// 한글 이름 칸은 아직 사람이 손대지 않았을 때만 자동으로 채운다
(() => {
  const f = $("sugform"); let auto = true;
  f.elements["ko"].addEventListener("input", () => { auto = false; });
  f.elements["zh"].addEventListener("input", () => { if (auto || !f.elements["ko"].value.trim()) { f.elements["ko"].value = zhToKo(f.elements["zh"].value); auto = true; } });
  $("suggest").addEventListener("click", () => { auto = true; });
})();

// ---------- 내 글(내가 낸 제안: 대기·공개·거절 모두) ----------
let MY = [];
async function openMine(silent) {
  if (!user) return;
  if (!silent) $("mydlg").showModal();
  $("mylist").innerHTML = '<div class="by" style="color:var(--sub)">불러오는 중</div>';
  const { data, error } = await sb.from("suggestions").select("*").eq("user_id", user.id).order("created_at", { ascending: false });
  if (error) { $("mylist").textContent = "불러오지 못했습니다"; return; }
  MY = data; const ST = { pending: "승인 대기", approved: "공개 중", rejected: "거절됨" };
  $("mylist").innerHTML = data.length ? data.map(x => `<div class="c"><div><b>${esc(x.ko)}</b>${x.target_place ? '<span class="by"> · 가게에 추가한 내용</span>' : ""}<span class="tag">${ST[x.status] || x.status}</span>${x.updated_at ? ' <span class="by">수정됨</span>' : ""}</div>
    ${x.admin_note ? `<div class="by">관리자 메모: ${esc(x.admin_note)}</div>` : ""}<div class="by"><button type="button" data-myedit="${x.id}">수정</button> <button type="button" data-mydel="${x.id}">삭제</button></div></div>`).join("")
    : '<div class="by" style="color:var(--sub)">올린 글이 없습니다. 댓글은 각 가게의 댓글 칸에서 수정할 수 있습니다.</div>';
}
$("mine").addEventListener("click", () => openMine());
$("myclose").addEventListener("click", () => $("mydlg").close());
$("mylist").addEventListener("click", async e => {
  const ed = e.target.closest("[data-myedit]"), del = e.target.closest("[data-mydel]");
  if (ed) { const row = MY.find(x => String(x.id) === ed.dataset.myedit); $("mydlg").close(); fromMine = true; return openEdit(row); }
  if (del) {
    if (del.dataset.sure !== "1") { del.dataset.sure = "1"; del.textContent = "삭제 확인"; return; }
    const row = MY.find(x => String(x.id) === del.dataset.mydel);
    const { error } = await sb.from("suggestions").delete().eq("id", del.dataset.mydel);
    if (error) return say("삭제하지 못했습니다: " + error.message);
    const paths = (row?.photos || []).map(u => decodeURIComponent((u.split("/object/public/photos/")[1] || ""))).filter(x => x.startsWith(user.id + "/"));
    if (paths.length) sb.storage.from("photos").remove(paths);
    toast("삭제했습니다"); openMine(true); load();
  }
});
// ---------- 첫 방문 안내(내용은 data/guide.json) ----------
let GUIDE = null;
async function initGuide() {
  try { GUIDE = await (await fetch("data/guide.json", { cache: "no-cache" })).json(); } catch (e) { return; }
  $("guidetitle").textContent = GUIDE.title || "안내";
  $("guidebody").innerHTML = (GUIDE.sections || []).map(x => `<h3>${esc(x.h)}</h3><ul>${(x.items || []).map(t => `<li>${esc(t)}</li>`).join("")}</ul>`).join("");
  let seen = null; try { seen = localStorage.getItem("guide_seen"); } catch (e) {}
  if (String(seen) !== String(GUIDE.version)) { $("guidedlg").showModal(); try { localStorage.setItem("guide_seen", String(GUIDE.version)); } catch (e) {} }   // 한 번 보여 주면 본 것으로 기록
}
$("guideform").addEventListener("submit", e => { e.preventDefault(); $("guidedlg").close(); });   // 닫기 이벤트가 늦어도 되도록 보여 줄 때 이미 기록한다
$("guidedlg").addEventListener("close", () => { try { if (GUIDE) localStorage.setItem("guide_seen", String(GUIDE.version)); } catch (e) {} });
$("guidebtn").addEventListener("click", () => { if (GUIDE) $("guidedlg").showModal(); });
initMap(); load(); refreshUser(); initGuide();
function syncMobile() { drawSheet(); if (isMobile()) { if (!$("sheet").style.getPropertyValue("--st")) setSheet("peek"); else setSheet(sheetState); } placeMapButtons(); }
syncMobile();
matchMedia("(max-width:820px)").addEventListener("change", () => { render(); syncMobile(); if (map) setTimeout(() => map.invalidateSize(), 50); });
window.addEventListener("resize", () => { if (isMobile()) setSheet(sheetState); placeMapButtons(); });
if (sb) sb.auth.onAuthStateChange(() => { setTimeout(refreshUser, 0); });  // 콜백 안에서 Supabase 함수를 기다리면 교착이 생기므로 밖으로 뺀다
</script>
