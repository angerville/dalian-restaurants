# Supabase 무료 프로젝트는 7일 동안 접속이 없으면 일시 정지됩니다. 일주일에 두 번 가볍게 접속해서 깨어 있게 합니다.
# 주의: GitHub은 저장소에 60일 동안 변경이 없으면 예약 작업을 자동으로 끌 수 있습니다. 그때는 Actions 탭에서 다시 켜거나, 아무 파일이나 수정해 커밋하세요.
name: keepalive
on:
  schedule:
    - cron: "17 3 * * 1,4"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supabase 깨우기
        run: |
          URL=$(sed -n 's/.*SUPABASE_URL: *"\([^"]*\)".*/\1/p' config.js)
          KEY=$(sed -n 's/.*SUPABASE_ANON_KEY: *"\([^"]*\)".*/\1/p' config.js)
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/comments?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "응답 코드: $code"
          test "$code" = "200"
